{% extends "base.html" %}
{% load static %}

{% block title %}注册成功 | {{ site_config.site_name_en }}{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-card returning-done">
        <p class="nf-eyebrow">// IDENTITY REVIEW</p>
        <h1>身份恢复申请已提交</h1>
        <p class="auth-sub" style="margin-top:10px;">
            管理组核验通过后即可登录，审核结果会发送到你的注册邮箱。<br>
            如需补充信息，可在招新 QQ 群联系管理组。
        </p>
        <div class="qq-card qq-card-compact">
            <img src="{% static 'img/recruit-qq-1081376858.01b7379e65be.png' %}" alt="2026 电子科技协会招新 QQ 群二维码">
            <div><span>2026 招新 QQ 群</span><strong>{{ site_config.recruit_qq_group }}</strong></div>
        </div>
        <a class="btn btn-outline" href="{% url 'core:home' %}">返回首页</a>
    </div>
</div>
{% endblock %}
