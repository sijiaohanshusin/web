三大方向的元件符号，构成一条「元件 → 芯片 → 整板」的递进。
分镜脚本原写的是「电阻→运放→MCU」，把电阻换成了运放当第一级：电阻代表不了
「硬件工程师」这个方向，而运放是模电的门面元件；第三级从元件语言升到「一块板」，
递进才落得住。都按 24 viewBox 画，与图标集同源。
