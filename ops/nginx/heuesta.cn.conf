# HEU ESTA 官网 nginx 配置
# 部署位置：/etc/nginx/sites-available/heuesta.cn（软链到 sites-enabled）
# 结构：/ 反代 Django(127.0.0.1:8001)；/static/ /media/ /learn/ 由 nginx 直接服务；
#       /protected/ 仅供 Django X-Accel-Redirect 内部使用（受保护资料下载）

server {
    server_name heuesta.cn;

    # EdgeOne 使用 HTTPS 回源时仍会通过此请求头传递访客原始协议。
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 200m;

    gzip on;
    # `.js` 的默认 MIME 在 nginx 上游 1.21.1 改成了 text/javascript（之前是
    # application/javascript），而各发行版打包的 mime.types 跟进时间不一样。
    # **本机实测（Ubuntu nginx/1.24.0）仍然是 application/javascript，JS 本来就在
    # 压缩**；两个都列上是为了换机器、升版本、或哪天 apt 更新了 mime.types 时不会
    # 悄悄退回「所有 JS 原样过网」—— 那种情况页面照常能用、日志里什么都没有。
    # 判断到底压没压不要靠读配置，跑 ops/verify.sh。
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # 前面挂着 EdgeOne：不发 Vary 的话 CDN 可能把压缩过的响应回给不支持压缩的客户端
    gzip_vary on;
    gzip_comp_level 5;

    # ---- 静态资源（collectstatic 输出，文件名带哈希，可放心长缓存/CDN 缓存） ----
    location /static/ {
        alias /srv/heuesta/static/;
        # 只用 add_header 给一条完整的 Cache-Control。`expires 365d` 会自己再发
        # 一条 max-age，于是响应里出现两个 Cache-Control 头 —— 各家 CDN 取哪一条
        # 不好说。max-age 与 365d 等价（31536000 秒）。
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- 资料文件禁止直链（必须走 Django 鉴权下载） ----
    location /media/resources/ {
        return 403;
    }

    # ---- 项目档案文件禁止直链（必须走 Django 鉴权下载） ----
    location /media/projects/ {
        return 403;
    }

    # ---- 展示素材只能经过动态权限检查，必须先于应用上传功能部署 ----
    location ^~ /media/showcase/ {
        add_header Cache-Control "private, no-store" always;
        return 403;
    }
    location ^~ /protected/showcase/ {
        internal;
        alias /srv/heuesta/media/showcase/;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- 其他上传文件（轮播图、头像等，公开） ----
    location /media/ {
        alias /srv/heuesta/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- 受保护下载：Django 鉴权后通过 X-Accel-Redirect 交给 nginx 传输 ----
    location /protected/ {
        internal;
        alias /srv/heuesta/media/;
    }

    # ---- 电子学学习中心（纯静态） ----
    location /learn/ {
        root /srv/heuesta/site;
        index index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        alias /srv/heuesta/static/robots.txt;
        access_log off;
    }
    location = /sitemap.xml {
        alias /srv/heuesta/static/sitemap.xml;
        access_log off;
    }
    location = /favicon.ico {
        alias /srv/heuesta/static/img/favicon.png;
        expires 30d;
        access_log off;
    }

    # ---- 动态页面反代 Django ----
    location / {
        # X-Frame-Options 必须在这一层发。**Django 那边发不出来** ——
        # django-simpleui 的 apps.py 在 ready() 里把 XFrameOptionsMiddleware 从
        # settings.MIDDLEWARE 里 pop 掉了（它的后台靠 iframe 开标签页），于是整站
        # 一个 X-Frame-Options 都没有，登录页和注册表单都能被任意站点套进 iframe。
        # 而 settings/base.py 里那一行看起来完全正常，从代码上看不出来。
        # SAMEORIGIN 而不是 DENY：同源要放行，否则 simpleui 后台自己打不开。
        # `always` 是必须的：不写的话 4xx/5xx 响应上就没有这个头。
        # 注意 nginx 的继承规则：一个 location 里只要出现了 add_header，就不再继承
        # 上层的 add_header —— 所以这条得写在这个 location 里面，写在 server 层会
        # 被 /static/ 那个块（它有自己的 Cache-Control）悄悄丢掉。
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/heuesta.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/heuesta.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = heuesta.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name heuesta.cn;
    return 404; # managed by Certbot
}
