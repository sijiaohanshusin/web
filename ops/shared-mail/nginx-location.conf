# Inside the existing HTTPS heuesta.cn server; no change to forum routing.
location = /shared-mail {
    add_header Cache-Control "private, no-store" always;
    return 302 /shared-mail/;
}
location ^~ /shared-mail/ {
    client_max_body_size 8k;
    access_log off;
    proxy_pass http://127.0.0.1:8012;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_redirect off;
    proxy_read_timeout 45s;
    proxy_connect_timeout 3s;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header CDN-Cache-Control;
    add_header Cache-Control "private, no-store, max-age=0, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
